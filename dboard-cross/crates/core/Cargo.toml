[package]
name = "dboard-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0", "dns-resolver"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
[dev-dependencies]
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
