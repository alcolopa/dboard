[package]
name = "dboard"
version.workspace = true
edition.workspace = true

[dependencies]
dboard-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "net"] }
arboard = { version = "3", default-features = false }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
