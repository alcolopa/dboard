name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dboard.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent dboard.app "dboard-${{ steps.tag.outputs.tag }}-macos.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: dboard ${{ steps.tag.outputs.tag }}
          files: dboard-${{ steps.tag.outputs.tag }}-macos.zip
          generate_release_notes: true
