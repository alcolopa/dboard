name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ---- macOS: one app bundle per architecture ----
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: dboard-cross, key: "${{ matrix.arch }}" }
      - name: Build
        working-directory: dboard-cross
        run: cargo build --release -p dboard
      # Optional Developer ID signing + notarization. Skipped (ad-hoc signing) unless these secrets exist:
      # MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY ("Developer ID Application: …"),
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password).
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Bundle dboard.app
        working-directory: dboard-cross
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/bundle.sh ../dboard.app "$TAG"
      - name: Notarize
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dboard.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dboard.app
          rm notarize.zip
      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dboard.app "dboard-${TAG}-macos-${{ matrix.arch }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: dboard ${{ env.TAG }}
          files: dboard-${{ env.TAG }}-macos-${{ matrix.arch }}.zip
          generate_release_notes: true

  # ---- Linux: tar.gz + .deb + .rpm per architecture (built natively) ----
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64,  deb: amd64, rpm: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb: arm64, rpm: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: dboard-cross, key: "${{ matrix.arch }}" }
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libwayland-dev rpm
      - name: Build
        working-directory: dboard-cross
        run: cargo build --release -p dboard
      - name: Package tar.gz (with install.sh), .deb and .rpm
        run: |
          name="dboard-${TAG}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp dboard-cross/target/release/dboard "$name/"
          cp dboard-cross/assets/icon.png "$name/dboard.png"
          cp dboard-cross/packaging/linux/dboard.desktop dboard-cross/packaging/linux/install.sh "$name/"
          cp dboard-cross/README.md "$name/README.md"
          tar -czf "$name.tar.gz" "$name"
          cd dboard-cross
          packaging/linux/build-deb.sh "$TAG" ${{ matrix.deb }}
          packaging/rpm/build-rpm.sh "$TAG" ${{ matrix.rpm }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: dboard ${{ env.TAG }}
          files: |
            dboard-${{ env.TAG }}-linux-${{ matrix.arch }}.tar.gz
            dboard-cross/dist/dboard-*-linux-${{ matrix.deb }}.deb
            dboard-cross/dist/dboard-*.${{ matrix.rpm }}.rpm

  # ---- Arch Linux (x86_64 only: there is no official aarch64 Arch container; the PKGBUILD also builds on aarch64) ----
  build-arch:
    needs: build-linux # the release/tag must exist: the PKGBUILD downloads the tag tarball
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        # makepkg checks the PKGBUILD's runtime depends=() too, so they must be installed in the container.
        run: pacman -Syu --noconfirm git rust fontconfig libxkbcommon libx11 libxcb wayland libxkbcommon-x11
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder .
          # makepkg refuses to run as root; the PKGBUILD fetches the tag's source tarball itself.
          su builder -c "cd $PWD/dboard-cross/packaging/arch && pkgver=${TAG#v} makepkg -f --noconfirm"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: dboard ${{ env.TAG }}
          files: dboard-cross/packaging/arch/dboard-*.pkg.tar.zst

  # ---- Windows: setup.exe per architecture ----
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,   arch: x86_64 }
          - { runner: windows-11-arm,   arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: dboard-cross, key: "${{ matrix.arch }}" }
      - name: Build
        working-directory: dboard-cross
        run: cargo build --release -p dboard
      - name: Build installer (Inno Setup)
        working-directory: dboard-cross
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${env:TAG}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DArch=${{ matrix.arch }}" packaging\windows\dboard.iss
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: dboard ${{ env.TAG }}
          files: dboard-cross/dist/dboard-*-windows-${{ matrix.arch }}-setup.exe
