name: Bug report
description: Report a reproducible problem with dboard.
body:
  - type: markdown
    attributes:
      value: "Use sanitized examples. Never include credentials or private database data. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: dboard version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, architecture and database version
      placeholder: macOS ARM64, PostgreSQL 16
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example schema or query if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
